<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Letra del Día - Juego Diario</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>LETRA DEL <span class="highlight">DÍA</span></h1>
    </header>

    <main id="game-container">
        <div id="board">
            <div class="tile" id="guess-tile">?</div>
        </div>

        <p id="message">Selecciona una letra para empezar</p>

        <div id="keyboard">
            </div>

        <div id="stats-container">
            <p>Siguiente letra en: <span id="timer">--:--:--</span></p>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
